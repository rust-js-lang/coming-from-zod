# coming-from-zod: one crate per chapter, each compiled to JavaScript by
# rust-js and compared, input by input, with the same schema in zod.
[workspace]
members = ["chapters/01-the-flip/rust", "chapters/02-refine-is-a-newtype/rust", "chapters/03-discriminated-union/rust", "chapters/04-extend-is-flatten/rust", "chapters/05-issues-have-a-path/rust", "chapters/06-optional-and-default/rust", "chapters/07-enum-is-an-enum/rust", "chapters/08-union-is-untagged/rust"]
# The pinned rust-js checkout, a submodule: not a member of this workspace.
exclude = ["rust-js"]
resolver = "3"
